name = "dugo-matching"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true

# Set the allowed browser origins for this deployment. Local Vite is included
# so the app can call the Worker in development.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173"

# One-minute fallback for requests that were not triggered by the app.
[triggers]
crons = ["* * * * *"]

# Secrets (see README/PHASES for values):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
#   wrangler secret put FIREBASE_API_KEY
#   wrangler secret put BREVO_API_KEY        # Brevo SMTP API key (free, 300/day)
#   wrangler secret put BREVO_SENDER_EMAIL   # Verified sender (single-sender ok)
#   wrangler secret put BREVO_SENDER_NAME    # e.g. Dugo+
