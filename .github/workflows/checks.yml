name: checks
#
# Build the app, validate the requirement traceability table, and run the
# Firestore security-rules suite against the emulator.
#
# The build and check-docs run offline: no Firebase credentials are needed,
# because the build only needs the app to compile and check-docs only reads two
# markdown files. The rules job downloads the emulator on first run but still
# needs no credentials — it runs under a demo project. Deploying is out of
# scope here on purpose; shipping is manual, from `prod`, via tools/deploy.sh
# (see docs/DEPLOY.md).
#
# check-docs is the reason this exists. AGENTS.md says a task is not complete
# until its requirement row is updated, and the script enforces that. Without
# this workflow the script only runs when someone remembers to run it, so a
# PR with an unfilled row would pass review. The rules job (D19) fails a PR
# that weakens a security boundary in firestore.rules.
#
# Runs on `main` and `integration`, because both are protected and both require
# this check. A PR targeting a branch that does not run this workflow would sit
# blocked forever waiting for a status that never arrives.

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Validate the traceability table
        run: node tools/check-docs.mjs

      - name: Account, audit, and matching regression tests
        run: npm run test:matching

      - name: Data-request service and closed-history regression tests
        run: npm run test:data-requests

      - name: Build
        working-directory: web
        run: npm run build

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Firestore security-rules suite
        run: npm run test:rules

      - name: Account Worker REST transaction suite
        run: npm run test:accounts:emulator

      - name: Donor response transaction suite
        run: npm run test:donor:emulator

      - name: Late-donor matching suite
        run: npm run test:matching:emulator

      - name: Hospital inventory Worker transaction suite
        run: npm run test:inventory:emulator

      - name: Completed donation history and request response suite
        run: npm run test:completion:emulator

      - name: Hospital donor directory isolation suite
        run: firebase emulators:exec --only firestore --project demo-dugo "node --test worker/src/hospitalDonors.emulator.test.js"
