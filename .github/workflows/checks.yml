name: checks
#
# Build the app and validate the requirement traceability table.
#
# Both checks run offline: no Firebase credentials are needed, because the
# build only needs the app to compile and check-docs only reads two markdown
# files. Deploying is out of scope here on purpose; shipping is manual, from
# `prod`, via tools/deploy.sh (see docs/DEPLOY.md).
#
# check-docs is the reason this exists. AGENTS.md says a task is not complete
# until its requirement row is updated, and the script enforces that. Without
# this workflow the script only runs when someone remembers to run it, so a
# PR with an unfilled row would pass review.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Validate the traceability table
        run: node tools/check-docs.mjs

      - name: Build
        working-directory: web
        run: npm run build
