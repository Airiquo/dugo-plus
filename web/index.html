<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2E8DF" />
    <link rel="icon" href="/favicon.png" />
    <title>dugo+</title>
    <script>
      // Reads the stored theme (dugo-theme) or the OS preference and sets
      // data-theme + the theme-color meta before the bundle boots.
      ;(function () {
        try {
          var t = localStorage.getItem('dugo-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#130e0e' : '#fbf6f1')
        } catch (e) {
          /* no storage access — keep the default light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
